<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--ink:#f5f3ee;--night:#111215}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.text-frame{position:relative;isolation:isolate;display:grid;place-items:center;width:1920px;height:1080px;padding:150px 220px;overflow:hidden;background:var(--night)}.text-frame::before{content:"";position:absolute;z-index:-2;inset:0;background:#17181b}.text-frame::after{content:"";position:absolute;z-index:-1;inset:150px;border:3px solid #b8612e;clip-path:polygon(0 0,22% 0,22% 3px,0 3px,0 22%,3px 22%,3px 0,100% 0,100% 78%,calc(100% - 3px) 78%,calc(100% - 3px) 100%,78% 100%,78% calc(100% - 3px),100% calc(100% - 3px),100% 0)}h1{display:-webkit-box;max-width:1400px;margin:0;text-align:center;color:var(--ink);font:600 96px/1.12 "Playfair Display",Georgia,serif;letter-spacing:-.055em;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap;text-shadow:0 4px 0 #060606,0 9px 14px #0009;-webkit-box-orient:vertical;-webkit-line-clamp:4}
</style></head><body><main class="text-frame" id="frame"><h1 id="text"></h1></main><script>
const text=document.getElementById('text');function fit(){const words=text.textContent.trim().split(/\s+/).filter(Boolean).length;let size=words<5?104:words<14?96:words<24?82:68;text.style.fontSize=`${size}px`;while(size>62&&text.scrollHeight>size*1.12*4+2){size-=2;text.style.fontSize=`${size}px`;}}window.renderTextCard=async data=>{text.textContent=data.text||'';fit();await document.fonts.ready;fit();};window.cardOverflow=()=>text.scrollHeight>text.clientHeight+1?['text']:[];
</script></body></html>
